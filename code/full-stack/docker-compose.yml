services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    env_file:
      - .env
    command: npm run test

  db-system-test:
    image: postgres:17
    profiles: ["system-test"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web-system-test:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["system-test"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-system-test:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db-system-test:
        condition: service_healthy

  system-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: ["system-test"]
    env_file:
      - .env
    environment:
      SYSTEM_TEST_BASE_URL: http://web-system-test:3000
    depends_on:
      - web-system-test
    command: npm run test:system

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    ports:
      - "8080:80"   # public entrypoint
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
