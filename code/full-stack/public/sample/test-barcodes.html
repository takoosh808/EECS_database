<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Test Barcodes</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; }
  .card { border: 1px solid #999; padding: 12px; width: min(100%, 800px); text-align: center; }
  .card svg { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }
  .meta { font-size: 13px; color: #444; margin-top: 6px; }
  input { width: 360px; padding: 6px; }
</style>
</head>
<body>
<h1>Test Barcodes (Code 128)</h1>
<p>Open this page on one screen and scan it with a handheld scanner or the "Use Camera" button.</p>
<p>Format: <code>SERIAL</code> fills Serial Number only. <code>SERIAL|Name|Location</code> also fills Name and Location.</p>

<p><input id="custom" placeholder="Type any text to generate a barcode" /></p>
<div class="grid" id="grid"></div>

<script>
// Bar/space widths for Code 128 symbols 0-106 (index = symbol value).
const P = "212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(" ");

function code128Svg(text) {
  const values = [104]; // Start B
  for (const ch of text) {
    const c = ch.charCodeAt(0);
    if (c < 32 || c > 126) throw new Error("ASCII only");
    values.push(c - 32);
  }
  let sum = values[0];
  for (let i = 1; i < values.length; i++) sum += values[i] * i;
  values.push(sum % 103, 106);

  let x = 10, rects = "";
  for (const v of values) {
    [...P[v]].forEach((w, i) => {
      const width = Number(w);
      if (i % 2 === 0) rects += `<rect x="${x}" y="0" width="${width}" height="100" fill="#000"/>`;
      x += width;
    });
  }
  const total = x + 10; // 10-module quiet zone on each side
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} 100">` +
         `<rect width="${total}" height="100" fill="#fff"/>${rects}</svg>`;
}

const samples = [
  ["WSU-002|raspberry pi", "Two fields: Serial Number and Name"],
  ["WSU-TEST-0001", "Serial only: fills Serial Number"],
  ["WSU-TEST-0002|Raspberry Pi 5|EECS Lab 101", "Fills Serial, Name, Location"],
  ["WSU-TEST-0003|Oscilloscope|Hardware Lab", "Fills Serial, Name, Location"],
  ["WSU-TEST-0004|Arduino Uno R3|Research Lab", "Fills Serial, Name, Location"],
];

const grid = document.getElementById("grid");
function addCard(text, note) {
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = code128Svg(text) + `<div><b></b></div><div class="meta"></div>`;
  d.querySelector("b").textContent = text;
  d.querySelector(".meta").textContent = note;
  return d;
}
function render() {
  grid.replaceChildren(...samples.map(([t, n]) => addCard(t, n)));
  const v = document.getElementById("custom").value;
  if (v) {
    try { grid.prepend(addCard(v, "Custom")); } catch (e) { alert(e.message); }
  }
}
document.getElementById("custom").addEventListener("input", render);
render();
</script>
</body>
</html>
